[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ausm-smart-rag"
version = "0.1.0"
description = "Local-first agentic Smart RAG with OKF, Ollama, Qdrant, and query analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "markitdown[docx,pdf,pptx,xlsx]==0.1.7",
  "pydantic-settings==2.15.0",
  "python-frontmatter==1.3.0",
  "python-multipart==0.0.32",
  "qdrant-client==1.19.0",
  "sqlalchemy==2.0.52",
  "structlog==25.5.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]
ui = [
  "streamlit==1.62.0",
]

[project.scripts]
smart-rag = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires local external services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
