[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ausm-smart-rag"
version = "0.1.0"
description = "Local-first agentic Smart RAG with OKF, Ollama, Qdrant, and query analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "markitdown[all]>=0.1.2,<1",
  "pydantic-settings>=2.10,<3",
  "python-frontmatter>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.19,<1.20",
  "sqlalchemy>=2.0.40,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
smart-rag = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires local external services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
